name: Update Loving Longmont HTML
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/standardize-hero.yml
permissions:
  contents: write
jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update HTML files
        run: |
          echo ' sLGNvdW50PTEpCiAgICBwLndyaXRlX3RleHQocyxlbmNvZGluZz0ndXRmLTgnKQpwPVBhdGgoJ2luZGV4Lmh0bWwnKQpzPXAucmVhZF90ZXh0KGVuY29kaW5nPSd1dGYtOCcpCnN0YXJ0PXM uZmluZCgnICAgIDxzZWN0aW9uIGNsYXNzPSJleHBsb3JlLXNlY3Rpb24iPicpCm1hcmtlcj0nICAgIDwhLS0gPT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PVxcb  ' | tr -d ' ' | base64 -d > /tmp/update_site.py
          python3 /tmp/update_site.py
      - name: Commit HTML changes
        run: |
          git config user.name "Loving Longmont Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes"
            exit 0
          fi
          git commit -m "Update all Loving Longmont HTML navigation and home cards"
          git push