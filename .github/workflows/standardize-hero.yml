name: Fix Longmont Restaurant Week Logo
on:
  push:
    branches: [main]
    paths: [.github/workflows/standardize-hero.yml]
permissions:
  contents: write
jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Restaurant Week image
        shell: python
        run: |
          from pathlib import Path
          p = Path('events.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://static.wixstatic.com/media/7bbd27_28eafdffbabe41bd9bf0e12a2f926215~mvImages/Website-Images/2.png/v1/fill/w_261,h_294,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/7bbd27_28eafdffbabe41bd9bf0e12a2f926215~mvImages/Website-Images/2.png'
          new = 'Images/LongmontRestaurantWeekLogo.avif'
          if old not in s:
              raise SystemExit('Restaurant Week image URL not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit events.html
        run: |
          git config user.name "Loving Longmont Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.html
          git commit -m "Fix Longmont Restaurant Week logo"
          git push
