name: Update Loving Longmont Businesses Page
on:
  push:
    branches: [main]
    paths: [.github/workflows/standardize-hero.yml]
permissions:
  contents: write
jobs:
  update-businesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update businesses page navigation and branding
        shell: python
        run: |
          from pathlib import Path
          p = Path('businesses.html')
          s = p.read_text(encoding='utf-8')

          # Match the standardized Loving Longmont brand used on Home/Events.
          s = s.replace('<strong>Loving Longmont</strong', '<strong>Loving <span class="red-heart">♥</span> Longmont</strong', 1)

          # Add Search to the top navigation while preserving all business content.
          old = '''          ><a href="sitemap.html">Site Map</a
          ><a href="contact.html" class="nav-contact">Contact</a>'''
          new = '''          ><a href="sitemap.html">Site Map</a
          ><a href="search.html">🔍 Search</a
          ><a href="contact.html" class="nav-contact">Contact</a>'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'href="search.html"' not in s:
              raise SystemExit('Could not locate Site Map/Contact navigation block')

          p.write_text(s, encoding='utf-8')
      - name: Commit businesses.html
        run: |
          git config user.name "Loving Longmont Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add businesses.html
          git commit -m "Standardize Local Businesses page navigation"
          git push
