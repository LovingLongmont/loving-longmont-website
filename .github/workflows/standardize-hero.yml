name: Standardize Loving Longmont header
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/standardize-hero.yml'
permissions:
  contents: write
jobs:
  update-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardize header navigation on all HTML pages
        shell: python
        run: |
          from pathlib import Path
          import re

          nav_items = [
              ('index.html','Home'),
              ('businesses.html','Businesses'),
              ('things-to-do.html','Things to Do'),
              ('events.html','Events'),
              ('community.html','Community'),
              ('spotlight.html','In The Spotlight'),
          ]

          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if '<header' not in s.lower():
                  continue

              active = p.name
              links=[]
              for href,label in nav_items:
                  cls=' class="active"' if href == active else ''
                  links.append(f'<a href="{href}"{cls}>{label}</a>')
              search_cls=' class="active search-link"' if active == 'search.html' else ' class="search-link"'
              links.append(f'<a href="search.html"{search_cls}>🔍 Search</a>')

              header=f'''<header class="site-header">
      <nav class="navbar">
        <a href="index.html" class="nav-logo nav-wordmark" aria-label="Loving Longmont home">
          <span class="loving-word">Loving</span><span class="wordmark-heart">♥</span><span class="longmont-word">Longmont</span>
        </a>
        <div class="nav-links">
          {' '.join(links)}
        </div>
      </nav>
    </header>'''

              # Replace first site header regardless of formatting.
              pat=re.compile(r'<header\b[^>]*class=["\'][^"\']*site-header[^"\']*["\'][^>]*>.*?</header>', re.I|re.S)
              if not pat.search(s):
                  continue
              s=pat.sub(header,s,count=1)

              if 'Unified Loving Longmont navigation' not in s:
                  css='''
      /* Unified Loving Longmont navigation */
      .nav-wordmark {
        display: inline-flex !important;
        align-items: center !important;
        gap: 5px !important;
        min-width: max-content !important;
        text-decoration: none !important;
        font-family: Georgia, "Times New Roman", serif !important;
        font-size: 23px !important;
        font-weight: 700 !important;
        line-height: 1 !important;
        color: var(--navy, #062f52) !important;
      }
      .wordmark-heart { color: var(--red, #c8101e) !important; font-size: 16px !important; }
      .nav-links { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
      .search-link { white-space: nowrap; }
      @media (max-width: 1180px) {
        .navbar { flex-direction: column; }
        .nav-links { justify-content: center; }
      }
'''
                  s=s.replace('</style>',css+'    </style>',1)

              # Standardize hero image as previously requested, except search which intentionally has no hero.
              if p.name not in {'index.html','search.html'}:
                  hero_pat=re.compile(r'<section\s+class=["\']hero["\'][^>]*>.*?</section>', re.I|re.S)
                  if hero_pat.search(s):
                      s=hero_pat.sub('<section class="hero">\n      <img src="Images/Website-Images/2.png" alt="Loving Longmont Colorado" />\n    </section>',s,count=1)
                      if 'Consistent Loving Longmont hero — matches home page' not in s:
                          override='''
      /* Consistent Loving Longmont hero — matches home page */
      .hero { width: 100%; min-height: 0 !important; padding: 0 !important; display: block !important; background: var(--cream, #fffaf1) !important; position: relative; }
      .hero img { width: 100% !important; height: auto !important; max-height: 700px !important; min-height: 0 !important; object-fit: cover !important; object-position: center !important; display: block !important; }
'''
                          s=s.replace('</style>',override+'    </style>',1)

              p.write_text(s,encoding='utf-8')
              print('updated',p)

      - name: Commit changes
        run: |
          git config user.name "Loving Longmont Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Loving heart Longmont and Search to site navigation"
          git push
