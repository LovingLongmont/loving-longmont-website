name: Update Loving Longmont Events
on:
  push:
    branches: [main]
    paths: [.github/workflows/standardize-hero.yml]
permissions:
  contents: write
jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update events.html only
        run: |
          echo '' | base64 -d > /tmp/update_events.py
          python3 /tmp/update_events.py
      - name: Commit events.html
        run: |
          git config user.name "Loving Longmont Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.html
          git commit -m "Standardize Events page navigation"
          git push
