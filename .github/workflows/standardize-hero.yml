name: Update Loving Longmont Home
on:
  push:
    branches: [main]
    paths: [.github/workflows/standardize-hero.yml]
permissions:
  contents: write
jobs:
  update-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index.html only
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Add Search to the existing full top navigation.
          if 'href="search.html"' not in s[s.find('<header class="site-header">'):s.find('</header>')]:
              s = s.replace(
                  '          <a href="sitemap.html"> Site Map </a>\n\n          <a href="contact.html" class="nav-contact"> Contact </a>',
                  '          <a href="sitemap.html"> Site Map </a>\n\n          <a href="search.html"> 🔍 Search </a>\n\n          <a href="contact.html" class="nav-contact"> Contact </a>',
                  1
              )

          # Make the visible brand read Loving ♥ Longmont.
          s = s.replace('<strong> Loving Longmont </strong>', '<strong> Loving <span class="red-heart">♥</span> Longmont </strong>', 1)

          # Replace only the home-page category-card section so it mirrors the top navigation.
          start = s.find('    <section class="explore-section">')
          end_marker = '    <!-- ========================================\n     COMMUNITY'
          end = s.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate home explore section')

          cards = [
              ('index.html','🏠','Home','Return to the Loving Longmont home page and discover what is new.','Visit Home →'),
              ('events.html','📅','Events','Find local events, festivals, markets, live music and community happenings.','View Events →'),
              ('businesses.html','🏪','Local Businesses','Discover and support the local businesses that make Longmont unique.','Find Businesses →'),
              ('things-to-do.html','🏔️','Things to Do','Explore parks, trails, attractions, recreation and activities for all ages.','Explore More →'),
              ('history.html','🏛️','History','Discover historic homes, pioneer buildings and places that preserve Longmont’s story.','Explore History →'),
              ('spotlight.html','🌟','In The Spotlight','Read Loving Longmont features about local businesses, people, places and stories.','Read Spotlights →'),
              ('animals.html','🐾','Animals & Pets','Find shelters, rescues, farms, veterinarians, pet supplies and animal resources.','Explore Animals & Pets →'),
              ('jobs.html','💼','Jobs','Find local job resources, career help, staffing agencies, side gigs and ways to find work.','Find Jobs →'),
              ('community.html','👥','Community','Ask questions, share recommendations and connect with Longmont neighbors.','Join the Community →'),
              ('sitemap.html','🗺️','Site Map','Browse the complete Loving Longmont directory and find every guide, resource and page.','View Site Map →'),
              ('search.html','🔍','Search','Search Loving Longmont for businesses, activities, events, resources, spotlights and more.','Search the Site →'),
              ('contact.html','✉️','Contact','Send Loving Longmont a business, event, photo, story, correction or community suggestion.','Contact Us →'),
          ]
          section = '    <section class="explore-section">\n      <div class="explore-grid">\n'
          for href, icon, title, desc, cta in cards:
              section += f'''        <a href="{href}" class="explore-card">\n          <div class="card-icon">{icon}</div>\n          <h3>{title}</h3>\n          <p>{desc}</p>\n          <div class="card-link">{cta}</div>\n        </a>\n\n'''
          section += '      </div>\n    </section>\n\n'
          s = s[:start] + section + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Commit index.html
        run: |
          git config user.name "Loving Longmont Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Update home navigation and category cards"
          git push
