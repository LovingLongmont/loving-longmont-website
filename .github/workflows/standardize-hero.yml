name: Standardize Loving Longmont site
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/standardize-hero.yml'
permissions:
  contents: write
jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update navigation and home cards
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          nav_items = [
              ('index.html','Home'), ('events.html','Events'),
              ('businesses.html','Local Businesses'), ('things-to-do.html','Things to Do'),
              ('history.html','History'), ('spotlight.html','In The Spotlight'),
              ('animals.html','Animals & Pets'), ('jobs.html','Jobs'),
              ('community.html','Community'), ('sitemap.html','Site Map'),
              ('search.html','🔍 Search')
          ]

          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              active = p.name
              links = []
              for href,label in nav_items:
                  cls = ' class="active"' if href == active else ''
                  links.append(f'<a href="{href}"{cls}>{label}</a>')
              links.append('<a href="contact.html" class="nav-contact">Contact</a>')
              header = '''<header class="site-header">
      <nav class="navbar">
        <a href="index.html" class="nav-logo">
          <img src="Images/Website-Images/1b.png" alt="Loving Longmont Logo" />
          <div class="nav-brand-text">
            <strong>Loving <span class="red-heart">♥</span> Longmont</strong>
            <small>PEOPLE <span class="red-heart">♥</span> PLACES <span class="red-heart">♥</span> POSSIBILITIES</small>
          </div>
        </a>
        <div class="nav-links">''' + ''.join(links) + '''</div>
      </nav>
    </header>'''
              pat = re.compile(r'<header\b[^>]*class=["\'][^"\']*site-header[^"\']*["\'][^>]*>.*?</header>', re.I|re.S)
              if pat.search(s):
                  s = pat.sub(header, s, count=1)
              # Keep the same hero artwork/crop everywhere a hero exists.
              if p.name != 'search.html':
                  hpat = re.compile(r'<section\s+class=["\']hero["\'][^>]*>.*?</section>', re.I|re.S)
                  if hpat.search(s):
                      s = hpat.sub('<section class="hero">\n      <img src="Images/Website-Images/2.png" alt="Loving Longmont Colorado" />\n    </section>', s, count=1)
              p.write_text(s, encoding='utf-8')

          # Make the home-page directory cards mirror every destination in top navigation.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('    <section class="explore-section">')
          end = s.index('    <!-- ========================================\n     COMMUNITY', start)
          cards = [
            ('index.html','🏠','Home','Return to the Loving Longmont homepage and discover what is new.','Visit Home →'),
            ('events.html','📅','Events','Find local events, festivals, markets, live music and community happenings.','View Events →'),
            ('businesses.html','🏪','Local Businesses','Discover and support the local businesses that make Longmont unique.','Find Businesses →'),
            ('things-to-do.html','🏔️','Things to Do','Explore parks, trails, attractions, recreation and activities for all ages.','Explore More →'),
            ('history.html','🏛️','Longmont History','Discover historic homes, pioneer buildings and places that preserve Longmont’s story.','Explore History →'),
            ('spotlight.html','📌','In The Spotlight','Read original Loving Longmont features about local people, places, organizations and businesses.','Read Spotlights →'),
            ('animals.html','🐾','Animals & Pets','Find shelters, rescues, farms, veterinarians, pet supplies and animal resources.','Explore Animals & Pets →'),
            ('jobs.html','💼','Jobs','Find local job resources, career help, staffing agencies, side gigs and ways to find work.','Find Jobs →'),
            ('community.html','👥','Community','Ask questions, share recommendations and connect with Longmont neighbors.','Join the Community →'),
            ('sitemap.html','🗺️','Site Map','Browse the complete Loving Longmont directory and find every guide, resource and page.','View Site Map →'),
            ('search.html','🔍','Search','Search Loving Longmont for businesses, activities, events, resources, spotlights and more.','Search the Site →'),
            ('contact.html','✉️','Contact','Send Loving Longmont a business, event, photo, story, correction or community suggestion.','Contact Us →')
          ]
          html = '    <section class="explore-section">\n      <div class="explore-grid">\n'
          for href,icon,title,desc,cta in cards:
              html += f'''        <a href="{href}" class="explore-card">\n          <div class="card-icon">{icon}</div>\n          <h3>{title}</h3>\n          <p>{desc}</p>\n          <div class="card-link">{cta}</div>\n        </a>\n'''
          html += '      </div>\n    </section>\n\n'
          s = s[:start] + html + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "Loving Longmont Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Standardize navigation and complete home directory cards"
          git push
